name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck SLURM scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint SLURM scripts
        run: |
          shellcheck -S style slurm/*.sh
      - name: bash -n syntax check
        run: |
          for f in slurm/*.sh; do bash -n "$f"; done

  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install license-free helper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests (no Schrödinger, no network)
        run: pytest -v
      - name: Reproduce the EGFR example outputs
        run: python examples/egfr/run_example.py
      - name: CLI smoke tests
        run: |
          python tools/extract_ligands.py examples/egfr/1M17.pdb --list
          python tools/extract_pocket.py examples/egfr/1M17.pdb --ligand-res AQ4 -c 5.0 -o /tmp/pocket.pdb
          python tools/grid_center.py examples/egfr/ligands/AQ4_A_999.pdb --json
          python tools/parse_glide.py examples/egfr/glide_results_example.csv
          python tools/squeue_summary.py examples/egfr/sacct_array_sample.txt
